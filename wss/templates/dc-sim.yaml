apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: dc-sim
  labels:
    workflows.diamond.ac.uk/science-group-mx: "true"
  annotations:
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/mx-workflows"
spec:
  entrypoint: workflow-entry
  arguments:
    parameters:
      - name: RECIPEWRAP
        value: "" # default value
      - name: OUTBOX
        value: "" # default value - directory the wrapper writes its outbound
                  # recipe messages to, in place of a broker it can't reach.
                  # Read back and replayed by DLSWorkflowsCluster.watch_job.

  templates:
  - name: run-dc-sim
    inputs:
      parameters:
        - name: RECIPEWRAP
        - name: OUTBOX
    script:
      image: ghcr.io/diamondlightsource/dlstbx
      command: [bash]
      workingDir: "/dls/tmp/wdr83388"
      volumeMounts:
      - name: "recwrap-workingdir"
        mountPath: "/dls/tmp/wdr83388"
      source: |
        export ZOCALO_CONFIG="/dls/science/users/wdr83388/zocalo-config/zocalo/configuration.yaml"
        echo dlstbx.wrap -e offline -t OutboxTransport --outbox "{{inputs.parameters.OUTBOX}}" --wrap dc_sim --recipewrapper "{{inputs.parameters.RECIPEWRAP}}" >runinfo
        dlstbx.wrap -e offline -t OutboxTransport --outbox "{{inputs.parameters.OUTBOX}}" --wrap dc_sim --recipewrapper "{{inputs.parameters.RECIPEWRAP}}"

    volumes:
    - name: recwrap-workingdir
      hostPath:
        path: "/dls/tmp/wdr83388"
        type: Directory

  - name: workflow-entry
    dag:
      tasks:
      - name: run-dc-sim
        template: run-dc-sim
        arguments:
          parameters:
          - name: RECIPEWRAP
            value: "{{workflow.parameters.RECIPEWRAP}}"
          - name: OUTBOX
            value: "{{workflow.parameters.OUTBOX}}"


