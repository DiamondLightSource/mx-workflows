apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: dc-sim
  labels:
    workflows.diamond.ac.uk/science-group-mx: "true"
  annotations:
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/mx-workflows"
spec:
  entrypoint: workflow-entry
  arguments:
    parameters:
      - name: RECIPEWRAP
        value: "" # default value

  templates:
  - name: run-dc-sim
    inputs:
      parameters:
        - name: RECIPEWRAP
    script:
      image: ghcr.io/diamondlightsource/dlstbx
      command: [bash]
      volumeMounts:
      - name: "dlsfilesystem"
        mountPath: "/dls/tmp/wdr83388"
      source: |
        echo dlstbx.wrap --wrap dc_sim --recipewrapper "{{inputs.parameters.RECIPEWRAP}}" >runinfo
        dlstbx.wrap --wrap dc_sim --recipewrapper "{{inputs.parameters.RECIPEWRAP}}"
    volumes: 
    - name: dlsfilesystem
      hostPath:
        path: "/dls/tmp/wdr83388"
        type: Directory

  - name: workflow-entry
    dag:
      tasks:
      - name: run-dc-sim
        template: run-dc-sim
        arguments:
          parameters:
          - name: RECIPEWRAP
            value: "{{workflow.parameters.RECIPEWRAP}}"
