apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: dc-sim
  labels:
    workflows.diamond.ac.uk/science-group-mx: "true"
  annotations:
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/mx-workflows"
spec:
  entrypoint: workflow-entry
  arguments:
    parameters:
      - name: RECIPEWRAP
        value: "" # default value

  templates:
  - name: run-dc-sim
    inputs:
      parameters:
        - name: RECIPEWRAP
    script:
      image: ghcr.io/diamondlightsource/dlstbx
      command: [bash]
      workingDir: "/dls/tmp/wdr83388"
      volumeMounts:
      - name: "recwrap-workingdir"
        mountPath: "/dls/tmp/wdr83388"
      - name: "zocalo-config"
        mountPath: "/dls_sw/apps/zocalo/"
      source: |
        export ZOCALO_CONFIG="/dls_sw/apps/zocalo/staging/configuration.yaml"
        echo dlstbx.wrap -e staging --wrap dc_sim --
         "{{inputs.parameters.RECIPEWRAP}}" >runinfo
        dlstbx.wrap -e staging --wrap dc_sim --recipewrapper "{{inputs.parameters.RECIPEWRAP}}"
        
    volumes: 
    - name: recwrap-workingdir
      hostPath:
        path: "/dls/tmp/wdr83388"
        type: Directory
    - name: zocalo-config
      hostPath:
        path: "/dls_sw/apps/zocalo/"

  - name: workflow-entry
    dag:
      tasks:
      - name: run-dc-sim
        template: run-dc-sim
        arguments:
          parameters:
          - name: RECIPEWRAP
            value: "{{workflow.parameters.RECIPEWRAP}}"


